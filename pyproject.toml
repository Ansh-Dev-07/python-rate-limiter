[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-rate-limiter"
version = "0.6.0"
description = "A thread-safe token bucket rate limiter implemented in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Ansh Soni" }
]

keywords = [
    "rate-limiter",
    "token-bucket",
    "python",
    "thread-safe",
    "backend"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "fastapi",
    "uvicorn"
]